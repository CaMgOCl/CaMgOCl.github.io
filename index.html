<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zcode 远程控制台入口</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#0a0d16;color:#eef0f8;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  main{text-align:center;padding:24px}
  h1{font-size:20px;font-weight:600}
  p{color:#a6abc4;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<main>
  <h1>Zcode 远程控制台</h1>
  <p>正在连接本机服务…</p>
</main>
<script>
function showDown(){ document.querySelector('p').textContent = '本机服务暂不可用，请稍后再试'; }
function tryUrl(list, i){
  if (i >= list.length) { showDown(); return; }
  var u = String(list[i]);
  if (!/^https:\/\//.test(u)) { tryUrl(list, i + 1); return; }
  var ctrl = new AbortController();
  var timer = setTimeout(function(){ ctrl.abort(); }, 7000);
  fetch(u + '/api/ping', { signal: ctrl.signal, cache: 'no-store' })
    .then(function(r){
      clearTimeout(timer);
      if (r.ok) { location.replace(u); } else { tryUrl(list, i + 1); }
    })
    .catch(function(){ clearTimeout(timer); tryUrl(list, i + 1); });
}
fetch('endpoint.json?t=' + Date.now(), { cache: 'no-store' })
  .then(function(r){ return r.json(); })
  .then(function(d){
    var list = (d && d.urls) || (d && d.url ? [d.url] : []);
    if (!list.length) { showDown(); return; }
    tryUrl(list, 0);
  })
  .catch(function(){ showDown(); });
</script>
</body>
</html>
